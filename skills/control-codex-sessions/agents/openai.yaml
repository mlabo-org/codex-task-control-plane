interface:
  display_name: "Codex Thread Orchestration"
  short_description: "Coordinate visible Codex tasks with durable state"
  brand_color: "#2563EB"
  default_prompt: "Use $control-codex-sessions to create a dry-run thread-orchestration plan for visible Codex tasks."
dependencies:
  tools:
    - type: "mcp"
      value: "codex_session_control_plane"
      description: "Durable task intents, bindings, observations, decisions, and bilingual dashboard"
      transport: "stdio"
policy:
  allow_implicit_invocation: true
